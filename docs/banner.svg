    <circle cx="1014" cy="186" r="4" fill="#04A8B4"/><text x="1028" y="191">DESIGN.md</text>
    <circle cx="1014" cy="218" r="4" fill="#4fb3ff"/><text x="1028" y="223">tokens.css</text>
    <circle cx="1014" cy="250" r="4" fill="#4fb3ff"/><text x="1028" y="255">components.css</text>
    <circle cx="1014" cy="282" r="4" fill="#E4B25A"/><text x="1028" y="287">index.html</text>
    <circle cx="1014" cy="314" r="4" fill="#E4B25A"/><text x="1028" y="319">assets/</text>
  </g>
  <text x="1008" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2BC4CF">sem IA, determinístico</text>

