  <rect x="934" y="180" width="34" height="34" rx="8" fill="#EEF0F3"/>
  <text x="808" y="272" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#EEF0F3">Aa</text>
  <text x="886" y="262" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#A0A8B4">16 · 24 · 40</text>
  <rect x="808" y="300" width="112" height="36" rx="10" fill="#04A8B4"/>
  <text x="864" y="323" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#03191B">Botão</text>
