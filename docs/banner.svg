<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="design-system-studio: O design system de qualquer site, pela URL.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="25%" r="75%">
      <stop offset="0" stop-color="#10303a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#090B10"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04A8B4"/><stop offset="0.5" stop-color="#4fb3ff"/><stop offset="1" stop-color="#E4B25A"/>
    </linearGradient>
    <linearGradient id="hex" x1="2" y1="4" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04A8B4"/><stop offset="0.5" stop-color="#4fb3ff"/><stop offset="1" stop-color="#E4B25A"/>
    </linearGradient>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#4fb3ff"/>
    </marker>
  </defs>

  <rect width="1280" height="420" fill="#090B10"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <text x="80" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="30" fill="#EEF0F3" letter-spacing="-0.5">design-system-studio</text>
  <circle cx="86" cy="140" r="5" fill="#2BC4CF"/>
  <text x="100" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#A0A8B4" letter-spacing="1.4">PLUGIN PARA CLAUDE CODE E AGY</text>
  <text x="80" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="41" fill="#ffffff" letter-spacing="-1.2">O design system de</text>
  <text x="80" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="41" fill="url(#acc)" letter-spacing="-1.2">qualquer site, pela URL.</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#A0A8B4">Paleta, fontes, tokens, componentes e logo,</text>
  <text x="80" y="331" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#A0A8B4">extraídos sem IA e prontos para revisar.</text>
  <rect x="80" y="352" width="420" height="40" rx="12" fill="#05070A" stroke="#2a3140" stroke-width="1.2"/>
  <text x="100" y="377" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="16" fill="#2BC4CF">$ uv run extrair.py --url https://site</text>

  <rect x="760" y="62" width="480" height="318" rx="18" fill="#0F1218" stroke="#1B202B" stroke-width="1.5"/>
  <rect x="790" y="84" width="420" height="38" rx="19" fill="#05070A" stroke="#2a3140" stroke-width="1.2"/>
  <circle cx="812" cy="103" r="5" fill="#2BC4CF"/>
  <text x="826" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#A0A8B4">https://www.site.com.br</text>
  <path d="M1000 126 V150" stroke="#4fb3ff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#seta)"/>
  <rect x="790" y="162" width="196" height="196" rx="14" fill="#151922" stroke="#1B202B" stroke-width="1.2"/>
  <rect x="808" y="180" width="34" height="34" rx="8" fill="#04A8B4"/>
  <rect x="850" y="180" width="34" height="34" rx="8" fill="#E4B25A"/>
